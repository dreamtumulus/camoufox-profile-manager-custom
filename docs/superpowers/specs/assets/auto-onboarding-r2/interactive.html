      widgetState: state,

    &quot;message&quot;,

          &quot;message&quot;,

&lt;script&gt;
(()=&gt;{

  // The chosen group&#x27;s profiles that have an email address, newest first. 019 was
  // onboarded earlier: it is listed, its browser can be run, and it gets no authorize link.
  const seeds=[{id:&#x27;019&#x27;,email:&#x27;user019@example.com&#x27;,ip:&#x27;203.0.113.19&#x27;,prior:true},{id:&#x27;018&#x27;,email:&#x27;user018@example.com&#x27;,ip:&#x27;203.0.113.18&#x27;},{id:&#x27;017&#x27;,email:&#x27;user017@example.com&#x27;,ip:&#x27;203.0.113.17&#x27;},{id:&#x27;016&#x27;,email:&#x27;user016@example.com&#x27;,ip:&#x27;203.0.113.16&#x27;}];
  const seedOf=id=&gt;seeds.find(x=&gt;x.id===id);

  function initial(){return {group:&#x27;uk-http&#x27;,node:&#x27;direct-1&#x27;,tokenRead:true,tokenPreview:&#x27;1dk_onb_demo…only&#x27;,tokenLabel:&#x27;演示令牌&#x27;,tokenAt:&#x27;&#x27;,tokenNote:&#x27;&#x27;,tokenEditing:false,tokenInvalid:false,tokenView:&#x27;full&#x27;,demo:&#x27;&#x27;,outcome:&#x27;&#x27;,proxyMode:&#x27;row&#x27;,proxyGroup:&#x27;&#x27;,poolProxy:&#x27;&#x27;,tokenOrgs:true,orgProfile:&#x27;org-a&#x27;,domain:&#x27;example.com&#x27;,org:&#x27;&#x27;,rows:freshRows(),dialog:&#x27;&#x27;,dialogError:&#x27;&#x27;,dialogNote:&#x27;&#x27;,error:&#x27;&#x27;,checked:null,checking:false,paramsOpen:true,logs:[]};}
  let s=initial(),revision=&#x27;&#x27;,counter=0,tokenBusy=&#x27;&#x27;,tokenSeq=0,anchorY=0,epoch=0;
  const instance=String(Date.now());
  // Something that happens a little later, unless the demo was reset in between.
  const later=(fn,ms)=&gt;{const at=epoch;setTimeout(()=&gt;{if(at===epoch)fn();},ms);};
  const rowOf=id=&gt;s.rows.find(x=&gt;x.id===id);
  const rows=()=&gt;s.demo===&#x27;no-pending&#x27;?[]:s.rows;
  const openAuth=r=&gt;!!r.auth&amp;&amp;(r.auth.status===&#x27;pending&#x27;||r.auth.status===&#x27;working&#x27;);
  const escape=v=&gt;String(v).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  const stamp=()=&gt;new Date().toLocaleTimeString(&#x27;zh-CN&#x27;,{hour12:false});
  function log(message){s.logs.push({time:stamp(),message});s.logs=s.logs.slice(-14);}
  function persist(){
    revision=instance+&#x27;-&#x27;+(++counter);
    const snapshot={...s,error:&#x27;&#x27;,dialogError:&#x27;&#x27;,dialogNote:&#x27;&#x27;,checking:false,logs:s.logs.slice(-8)};
    if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{prototype:&#x27;上号 R3&#x27;,browsersRunning:s.rows.filter(r=&gt;r.running).length,authorizationsOpen:s.rows.filter(openAuth).length,onboarded:s.rows.filter(r=&gt;r.onboarded).length,dialog:s.dialog||null},privateContent:{version:3,revision,state:snapshot}}).catch(()=&gt;{});
  }
  function saveRender(){render();persist();}
  function restore(raw){
    const p=raw?.privateContent;
    if(!p||p.version!==3||!p.state||p.revision===revision)return;
    const v=p.state;if(!Array.isArray(v.rows))return;
    epoch++;s={...initial(),...v};
    s.rows=freshRows().map(base=&gt;({...base,...(v.rows.find(x=&gt;x.id===base.id)||{}),id:base.id,busy:&#x27;&#x27;}));
