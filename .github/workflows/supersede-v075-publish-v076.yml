name: Supersede v0.7.5 and publish v0.7.6

on:
  push:
    branches: [custom-onboarding]

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Supersede v0.7.5 and publish v0.7.6'
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.7.6
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.7.6
          draft: false
          generate_release_notes: true
      - name: Cancel and remove the superseded v0.7.5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 45821211875 || true
          gh release delete v0.7.5 --yes || true
