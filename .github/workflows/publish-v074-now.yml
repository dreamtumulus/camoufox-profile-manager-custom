name: Publish completed v0.7.4 assets

on:
  push:
    branches: [custom-onboarding]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish completed v0.7.4 assets'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.7.4 --draft=false
