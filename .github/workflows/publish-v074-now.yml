name: Publish completed v0.7.4 assets

on:
  push:
    branches: [custom-onboarding]

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Publish completed v0.7.4 assets')
    runs-on: ubuntu-latest
    steps:
      - name: Publish the existing draft
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.7.4
          draft: false
          make_latest: false
          generate_release_notes: true
