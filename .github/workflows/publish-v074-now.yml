name: Publish completed v0.7.4 assets

on:
  push:
    branches: [custom-onboarding]

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Publish completed v0.7.4 assets')
    runs-on: ubuntu-latest
    steps:
      - name: Publish the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.4" --jq .id)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false
