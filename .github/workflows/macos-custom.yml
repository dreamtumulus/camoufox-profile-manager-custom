name: Custom desktop releases

on:
  workflow_dispatch:
  push:
    tags: ["v*-zhaolusi*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x86_64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra build --extra sync
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - name: Build desktop app with Camoufox
        run: uv run --no-sync python scripts/build_desktop.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Smoke frozen recovery dispatcher
        run: uv run --no-sync python scripts/smoke_desktop_recovery.py
      - name: Create installer
        run: uv run --no-sync python scripts/build_desktop.py --package-only
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil verify dist/*.dmg
      - name: Verify Windows installer data preservation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "dist\*-setup.exe").FullName
          uv run --no-sync python scripts/windows_installer_acceptance.py $installer --output windows-installer.json
          if ($LASTEXITCODE -ne 0) { throw "Installer acceptance failed" }
      - name: Write checksums
        run: uv run --no-sync python scripts/build_desktop.py --checksums-only
      - uses: actions/upload-artifact@v7
        with:
          name: camoufox-pm-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.sha256
      - name: Publish release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.sha256
